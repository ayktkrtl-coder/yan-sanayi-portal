<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yan Sanayi İş Takip Portalı</title>
    <!-- Tasarımın ve butonların düzelmesini sağlayan resmi Bootstrap bağlantısı eklendi -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; border-left: 5px solid #3498db; }
        .badge-bekliyor { background-color: #6c757d; color: white; }
        .badge-uretimde { background-color: #0dcaf0; color: #000; }
        .badge-bitti { background-color: #198754; color: white; }
        .info-block { background: #f8f9fa; padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 5px; }
        .sticky-top-panel { position: sticky; top: 0; background: rgba(244, 246, 249, 0.95); z-index: 1000; padding: 15px 0; border-bottom: 1px solid #e2e8f0; }
    </style>
</head>
<body>
<div class="container py-4">
    <div class="text-center mb-4" id="headerSection">
        <h2 class="fw-bold text-primary">Yan Sanayi İş Takip Portalı</h2>
        <p class="text-muted">Güncel fason siparişlerinizi görüntüleyin ve durum bildirimi yapın.</p>
    </div>

    <!-- Giriş Ekranı -->
    <div id="loginSection" class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4" style="border-left: none;">
                <label class="form-label fw-bold">Tedarikçi Adınızı Girin:</label>
                <input type="text" id="firmaAdi" class="form-control mb-3" placeholder="ERP'deki tam tedarikçi adınız">
                <button onclick="isleriListele()" class="btn btn-primary w-100 fw-bold">İşlerimi Listele</button>
            </div>
        </div>
    </div>

    <!-- İş Listesi Üst Sabit Panel -->
    <div id="listSection" class="d-none">
        <div class="sticky-top-panel">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div>
                    <h4 id="welcomeText" class="fw-bold text-dark m-0"></h4>
                    <small class="text-muted" id="totalCount"></small>
                </div>
                <div class="d-flex gap-2">
                    <button onclick="topluKaydet()" id="btnTopluKaydet" class="btn btn-success fw-bold px-4 shadow-sm">⚡ Tüm Listeyi Toplu Kaydet</button>
                    <button onclick="location.reload()" class="btn btn-danger fw-bold">Çıkış Yap</button>
                </div>
            </div>
        </div>
        <div id="isKartlari" class="mt-4"></div>
    </div>
</div>

<script>
    // Sizin en son ürettiğiniz Google Apps Script Canlı Bağlantı Linkiniz entegre edildi
    const API_URL = "https://script.google.com/macros/s/AKfycbzvsf9cQc1LzY02xV4pGT30tLhgLXhl257rQNnSFpTF3T-UAPjLCAayfytS9nk293113w/exec"; 

    let aktifFirma = "";
    let mevcutIsler = [];

    // Verileri Listeleme Fonksiyonu
    function isleriListele() {
        aktifFirma = document.getElementById("firmaAdi").value.trim();
        if(!aktifFirma) return alert("Lütfen tedarikçi adınızı girin.");
        
        document.getElementById("loginSection").classList.add("d-none");
        document.getElementById("listSection").classList.remove("d-none");
        document.getElementById("headerSection").classList.add("d-none");
        document.getElementById("isKartlari").innerHTML = `<div class="text-center my-5"><div class="spinner-border text-primary"></div><p class="mt-2">İşleriniz yükleniyor...</p></div>`;

        fetch(`${API_URL}?action=read&firma=${encodeURIComponent(aktifFirma)}`)
        .then(res => res.json())
        .then(data => {
            mevcutIsler = data;
            let html = "";
            document.getElementById("totalCount").innerText = `Toplam Kalem Sayısı: ${data.length}`;
            
            if(data.length === 0) {
                html = `<div class="alert alert-warning text-center fw-bold">Aktif fason iş emri bulunamadı. Lütfen firma adını ERP'dekiyle birebir aynı yazdığınızdan emin olun.</div>`;
                document.getElementById("btnTopluKaydet").classList.add("d-none");
            } else {
                document.getElementById("btnTopluKaydet").classList.remove("d-none");
                data.forEach(is => {
                    let badgeClass = is.firmaDurumu === 'Bitti' ? 'badge-bitti' : (is.firmaDurumu === 'Üretimde' ? 'badge-uretimde' : 'badge-bekliyor');
                    html += `
                    <div class="card p-3" data-id="${is.id}">
                        <div class="d-flex justify-content-between align-items-start flex-wrap">
                            <div class="mb-2">
                                <span class="badge ${badgeClass} mb-2" id="badge_${is.id}">${is.firmaDurumu}</span>
                                <h5 class="fw-bold mb-1" style="color: #2c3e50;">${is.tanim}</h5>
                                <small class="text-muted">Sipariş No: <b>${is.sprsNo}</b> | Satır No: <b>${is.strNo}</b> | 2. Kalem No: <b>${is.kalemNo}</b></small>
                            </div>
                            <div class="text-md-end mb-2">
                                <span class="text-muted d-block small fw-bold">Kalan Bakiye</span>
                                <span class="fs-3 fw-bold text-primary">${is.bakiye} ${is.ob || 'Adet'}</span>
                            </div>
                        </div>
                        
                        <div class="row my-2 g-2 text-dark">
                            <div class="col-6 col-sm-3"><div class="info-block"><b>Sipariş Tipi:</b> ${is.spTp}</div></div>
                            <div class="col-6 col-sm-3"><div class="info-block"><b>İlgili No:</b> ${is.ilgiliNo || '-'}</div></div>
                            <div class="col-6 col-sm-3"><div class="info-block"><b>Sipariş Tarihi:</b> ${is.sprsTarihi}</div></div>
                            <div class="col-6 col-sm-3"><div class="info-block"><b>Söz Verilen Teslim:</b> <span class="text-danger fw-bold">${is.teslimTarihi}</span></div></div>
                        </div>

                        <hr class="my-2">
                        
                        <div class="row g-2 align-items-end">
                            <div class="col-6 col-md-3">
                                <label class="small fw-bold text-secondary mb-1">Üretim Durumu</label>
                                <select id="durum_${is.id}" class="form-select form-select-sm" onchange="badgeGuncelle(${is.id}, this.value)">
                                    <option value="Bekliyor" ${is.firmaDurumu=='Bekliyor'?'selected':''}>Bekliyor</option>
                                    <option value="Üretimde" ${is.firmaDurumu=='Üretimde'?'selected':''}>Üretimde</option>
                                    <option value="Bitti" ${is.firmaDurumu=='Bitti'?'selected':''}>Bitti / Sevk Edildi</option>
                                </select>
                            </div>
                            <div class="col-6 col-md-3">
                                <label class="small fw-bold text-secondary mb-1">Üretilen Miktar</label>
                                <input type="number" id="adet_${is.id}" class="form-control form-control-sm" placeholder="Miktar girin" value="${is.uretilenMiktar}">
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="small fw-bold text-secondary mb-1">Yan Sanayi Notu / Açıklama</label>
                                <input type="text" id="not_${is.id}" class="form-control form-control-sm" placeholder="Fire, gecikme vb. açıklamalar" value="${is.yanSanayiNotu}">
                            </div>
                        </div>
                    </div>`;
                });
            }
            document.getElementById("welcomeText").innerText = `Tedarikçi: ${aktifFirma}`;
            document.getElementById("isKartlari").innerHTML = html;
        });
    }

    // Durum Değiştiğinde Rozet Rengini Güncelleyen Fonksiyon
    function badgeGuncelle(id, deger) {
        let el = document.getElementById(`badge_${id}`);
        el.innerText = deger;
        el.className = "badge mb-2 " + (deger === 'Bitti' ? 'badge-bitti' : (deger === 'Üretimde' ? 'badge-uretimde' : 'badge-bekliyor'));
    }

    // Değişiklikleri Google Sheet'e Kaydeden Fonksiyon
    function topluKaydet() {
        let guncellenecekler = [];
        mevcutIsler.forEach(is => {
            let durum = document.getElementById(`durum_${is.id}`).value;
            let adet = document.getElementById(`adet_${is.id}`).value;
            let not = document.getElementById(`not_${is.id}`).value;
            
            guncellenecekler.push({
                id: is.id,
                firmaDurumu: durum,
                uretilenMiktar: adet,
                yanSanayiNotu: not
            });
        });

        document.getElementById("btnTopluKaydet").disabled = true;
        document.getElementById("btnTopluKaydet").innerText = "⏳ Kaydediliyor...";

        fetch(API_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "update", rows: guncellenecekler })
        }).then(() => {
            alert("Tüm değişiklikler Google Etabloya başarıyla kaydedildi!");
            document.getElementById("btnTopluKaydet").disabled = false;
            document.getElementById("btnTopluKaydet").innerText = "⚡ Tüm Listeyi Toplu Kaydet";
            isleriListele();
        }).catch(err => {
            alert("Kayıt sırasında bir hata oluştu: " + err);
