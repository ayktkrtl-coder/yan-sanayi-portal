<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yan Sanayi İş Takip Portalı</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; }
        body { 
            background-color: var(--bg); 
            font-family: 'Inter', -apple-system, sans-serif; 
            margin: 0; 
            padding: 0; 
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 16px 20px; }
        
        .card { 
            background-color: var(--card-bg); 
            border-radius: 8px; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.03); 
            border: 1px solid var(--border-color);
            margin-bottom: 8px; 
            padding: 10px 14px; 
            border-left: 4px solid var(--primary); 
            transition: all 0.15s ease;
        }
        .card:hover { border-color: #cbd5e1; }
        .card.modified { 
            border-left-color: var(--warning) !important; 
            background-color: #fffbeb; 
            border-color: #fde68a;
        }

        .form-control, .form-select { 
            display: block; 
            width: 100%; 
            padding: 5px 8px; 
            font-size: 13px; 
            font-family: inherit;
            color: var(--text-main);
            background-color: #fff;
            border: 1px solid var(--border-color); 
            border-radius: 6px; 
            transition: border-color 0.15s ease;
        }
        .form-control:focus, .form-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.15);
        }

        .btn { 
            display: inline-flex; 
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-weight: 600; 
            padding: 7px 14px; 
            font-size: 13px; 
            border-radius: 6px; 
            border: none; 
            cursor: pointer; 
            color: #fff; 
            transition: all 0.15s ease;
        }
        .btn:hover { opacity: 0.95; }
        .btn-primary { background-color: var(--primary); width: 100%; font-size: 14px; padding: 10px; }
        .btn-success { background-color: var(--success); }
        .btn-excel { background-color: #059669; }
        .btn-danger { background-color: var(--danger); }
        .btn-warning { background-color: var(--warning); color: #fff; }
        
        .btn-filter { 
            background-color: #f1f5f9; 
            color: var(--text-muted); 
            padding: 5px 12px; 
            font-size: 12px; 
            font-weight: 600; 
            border-radius: 16px; 
            border: 1px solid var(--border-color); 
            cursor: pointer; 
        }
        .btn-filter.active { background-color: var(--primary); color: #fff; border-color: var(--primary); }

        .d-none { display: none !important; }
        .d-flex { display: flex !important; }
        .justify-content-between { justify-content: space-between !important; }
        .align-items-center { align-items: center !important; }
        .gap-2 { gap: 8px !important; }
        
        .badge { 
            display: inline-block; 
            padding: 2px 6px; 
            font-size: 10px; 
            font-weight: 700; 
            border-radius: 4px; 
            text-transform: uppercase;
        }
        .badge-bekliyor { background-color: #fef3c7; color: #d97706; }
        .badge-uretimde { background-color: #dbeafe; color: #2563eb; }
        .badge-bitti { background-color: #d1fae5; color: #059669; }

        .info-pill {
            background-color: #f1f5f9;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            color: var(--text-muted);
            border: 1px solid #e2e8f0;
        }

        .sticky-top-panel { 
            position: sticky; 
            top: 0; 
            background: rgba(248, 250, 252, 0.95); 
            backdrop-filter: blur(8px);
            z-index: 1000; 
            padding: 10px 0; 
            border-bottom: 1px solid var(--border-color); 
            margin-bottom: 12px;
        }

        .spinner { 
            border: 3px solid rgba(79, 70, 229, 0.1); 
            width: 28px; 
            height: 28px; 
            border-radius: 50%; 
            border-left-color: var(--primary); 
            animation: spin 0.8s linear infinite; 
            margin: 20px auto; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .drop-zone {
            border: 2px dashed var(--primary);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            background-color: #f0f3ff;
            cursor: pointer;
        }
        
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 2000;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="text-center mb-2" id="headerSection" style="margin-bottom:16px;">
        <h3 style="color:var(--primary); font-weight:700; margin:0;"><i class="fa-solid fa-boxes-stacked"></i> Yan Sanayi İş Takip Portalı</h3>
    </div>

    <!-- Login Section -->
    <div id="loginSection">
        <div class="card" style="max-width: 380px; margin: 30px auto; padding: 24px; border-left: none;">
            <div style="text-align:center; margin-bottom:16px;">
                <i class="fa-solid fa-building-user" style="font-size:32px; color:var(--primary);"></i>
                <h4 style="margin:8px 0 2px 0;">Portal Girişi</h4>
            </div>
            <label style="font-weight:600; font-size:12px; margin-bottom:4px; display:block;">Tedarikçi Adı veya Yetkili Kodu:</label>
            <input type="text" id="firmaAdi" class="form-control" style="margin-bottom:8px;" placeholder="Firma adınızı veya ADMIN yazın...">
            
            <label style="font-weight:600; font-size:12px; margin-bottom:4px; display:block;">Giriş Şifresi:</label>
            <input type="password" id="firmaPass" class="form-control" style="margin-bottom:12px;" placeholder="Şifreniz...">

            <button onclick="girisYap()" id="btnListele" class="btn btn-primary"><i class="fa-solid fa-right-to-bracket"></i> Giriş Yap</button>
        </div>
    </div>

    <!-- Admin Panel Section -->
    <div id="adminSection" class="d-none">
        <div class="card" style="max-width: 500px; margin: 20px auto; padding: 24px;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 style="margin:0; color:var(--primary);"><i class="fa-solid fa-user-gear"></i> JDE Veri Güncelleme Paneli</h4>
                <button onclick="location.reload()" class="btn btn-danger"><i class="fa-solid fa-right-from-bracket"></i> Çıkış</button>
            </div>
            
            <div class="drop-zone" onclick="document.getElementById('excelFileInput').click()">
                <i class="fa-solid fa-cloud-arrow-up" style="font-size:36px; color:var(--primary); margin-bottom:8px;"></i>
                <h5 style="margin:0 0 4px 0;">JDE Excel Dosyasını Buraya Bırakın</h5>
                <small style="color:var(--text-muted);">Veya seçmek için tıklayın (.xlsx / .csv)</small>
                <input type="file" id="excelFileInput" class="d-none" accept=".xlsx, .xls, .csv" onchange="jdeExcelYukle(event)">
            </div>
            <div id="uploadStatus" style="margin-top:12px; text-align:center; font-size:13px;"></div>
        </div>
    </div>

    <!-- Main Content Section -->
    <div id="listSection" class="d-none">
        <div class="sticky-top-panel">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <span id="welcomeText" style="font-weight:700; color:var(--text-main); font-size:16px;"></span>
                    <small style="color:var(--text-muted); margin-left:8px;" id="totalCount"></small>
                </div>
                <div class="d-flex gap-2">
                    <button onclick="sifreModalAc()" class="btn btn-warning"><i class="fa-solid fa-key"></i> Şifre Değiştir</button>
                    <button onclick="excelIndir()" class="btn btn-excel"><i class="fa-solid fa-file-excel"></i> Excel İndir</button>
                    <button onclick="topluKaydet()" id="btnTopluKaydet" class="btn btn-success"><i class="fa-solid fa-floppy-disk"></i> Toplu Kaydet</button>
                    <button onclick="location.reload()" class="btn btn-danger"><i class="fa-solid fa-right-from-bracket"></i> Çıkış</button>
                </div>
            </div>
            
            <div class="d-flex justify-content-between align-items-center gap-2" style="margin-top:8px;">
                <div style="position:relative; flex:1; max-width:260px;">
                    <i class="fa-solid fa-magnifying-glass" style="position:absolute; left:10px; top:8px; color:var(--text-muted); font-size:11px;"></i>
                    <input type="text" id="aramaKutusu" class="form-control" style="padding-left:28px;" placeholder="Sipariş No, Tanım veya İlgili No ara..." oninput="kartlariFiltrele()">
                </div>
                <div class="d-flex gap-2">
                    <button class="btn-filter active" onclick="durumFiltrele('Tumu', this)">Tümü</button>
                    <button class="btn-filter" onclick="durumFiltrele('Bekliyor', this)">Bekleyenler</button>
                    <button class="btn-filter" onclick="durumFiltrele('Uretimde', this)">Üretimdekiler</button>
                    <button class="btn-filter" onclick="durumFiltrele('Bitti', this)">Bitenler</button>
                </div>
            </div>
        </div>

        <div id="isKartlari"></div>
    </div>

    <!-- Şifre Değiştirme Modal -->
    <div id="sifreModal" class="modal d-none">
        <div class="card" style="width:340px; padding:20px; border-left:none;">
            <h4 style="margin:0 0 12px 0; color:var(--primary);"><i class="fa-solid fa-key"></i> Şifre Değiştir</h4>
            <label style="font-size:12px; font-weight:600;">Yeni Şifreniz:</label>
            <input type="password" id="newPass1" class="form-control" style="margin-bottom:8px;" placeholder="Yeni Şifre">
            <label style="font-size:12px; font-weight:600;">Yeni Şifre (Tekrar):</label>
            <input type="password" id="newPass2" class="form-control" style="margin-bottom:12px;" placeholder="Tekrar">
            <div class="d-flex gap-2">
                <button onclick="sifreGuncelle()" class="btn btn-success" style="flex:1;">Kaydet</button>
                <button onclick="sifreModalKapat()" class="btn btn-danger" style="flex:1;">İptal</button>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwN3cH9-i6N5aYNdBmYRjOe_8Hm6hovwi7N4_h1k6o8VaRmePVUHlcsRsYY9uOwjdfz/exec"; 
    const ADMIN_SIFRE = "1234"; 

    let aktifFirma = "";
    let girilenSifre = "";
    let mevcutIsler = [];
    let aktifDurumFiltresi = "Tumu";

    function scriptTemizle() {
        const tempScripts = document.querySelectorAll('.jsonp-temp');
        tempScripts.forEach(s => s.remove());
    }

    function formatVeri(deger) {
        if (deger === undefined || deger === null) return "-";
        var str = String(deger).trim();
        return str === "" ? "-" : str;
    }

    function formatTarihEkrana(tarihStr) {
        if (!tarihStr || tarihStr === "-" || tarihStr === "undefined") return "-";
        try {
            var str = String(tarihStr).trim();
            if (str.includes("T")) str = str.split("T")[0];
            var parts = str.split("-");
            if (parts.length === 3) return parts[2] + "." + parts[1] + "." + parts[0];
            return str;
        } catch(e) { return tarihStr; }
    }

    // Sipariş Tarihine Göre Geçen Gün Sayısını Hesaplama Fonksiyonu
    function sprsGecenGunHesapla(tarihStr) {
        if (!tarihStr || tarihStr === "-" || tarihStr === "undefined") return "-";
        try {
            var str = String(tarihStr).trim();
            if (str.includes("T")) str = str.split("T")[0];
            var parts = str.split("-");
            
            if (parts.length === 3) {
                var sprsTarihi = new Date(parts[0], parts[1] - 1, parts[2]);
                var bugun = new Date();
                
                // Saat sıfırlama (Sadece gün farkını almak için)
                bugun.setHours(0,0,0,0);
                sprsTarihi.setHours(0,0,0,0);
                
                var farkZaman = bugun.getTime() - sprsTarihi.getTime();
                var farkGun = Math.floor(farkZaman / (1000 * 3600 * 24));
                
                if (farkGun <= 0) return "Bugün";
                return farkGun + " Gün";
            }
            return "-";
        } catch(e) { return "-"; }
    }

    function girisYap() {
        var inputVal = document.getElementById("firmaAdi").value.trim();
        girilenSifre = document.getElementById("firmaPass").value.trim();

        if(!inputVal) return alert("Lütfen firma adınızı girin.");
        if(!girilenSifre) return alert("Lütfen şifrenizi girin.");

        if(inputVal.toUpperCase() === "ADMIN") {
            if(girilenSifre === ADMIN_SIFRE) {
                document.getElementById("loginSection").classList.add("d-none");
                document.getElementById("headerSection").classList.add("d-none");
                document.getElementById("adminSection").classList.remove("d-none");
            } else {
                alert("Hatalı yönetici şifresi!");
            }
        } else {
            isleriListele(inputVal, girilenSifre);
        }
    }

    function isleriListele(firma, sifre) {
        aktifFirma = firma;
        document.getElementById("loginSection").classList.add("d-none");
        document.getElementById("listSection").classList.remove("d-none");
        document.getElementById("headerSection").classList.add("d-none");
        document.getElementById("welcomeText").innerText = aktifFirma.toUpperCase() + " İŞ LİSTESİ";
        document.getElementById("isKartlari").innerHTML = '<div class="text-center" style="padding:20px;"><div class="spinner"></div><p style="color:var(--text-muted); font-size:13px;">Yükleniyor...</p></div>';

        scriptTemizle();
        const script = document.createElement('script');
        script.className = 'jsonp-temp';
        script.src = API_URL + "?action=read&firma=" + encodeURIComponent(aktifFirma) + "&sifre=" + encodeURIComponent(sifre) + "&callback=veriGeriDonusIsle";
        document.body.appendChild(script); 
    }

    function sifreModalAc() { document.getElementById("sifreModal").classList.remove("d-none"); }
    function sifreModalKapat() { document.getElementById("sifreModal").classList.add("d-none"); }

    function sifreGuncelle() {
        var p1 = document.getElementById("newPass1").value.trim();
        var p2 = document.getElementById("newPass2").value.trim();

        if(!p1 || !p2) return alert("Şifre alanlarını doldurun.");
        if(p1 !== p2) return alert("Şifreler uyuşmuyor!");

        scriptTemizle();
        const script = document.createElement('script');
        script.className = 'jsonp-temp';
        script.src = API_URL + "?action=changePassword&firma=" + encodeURIComponent(aktifFirma) + "&yeniSifre=" + encodeURIComponent(p1) + "&callback=sifreSonuc";
        document.body.appendChild(script);
    }

    function sifreSonuc(res) {
        scriptTemizle();
        if(res && res.status === "success") {
            alert("Şifreniz başarıyla değiştirildi!");
            sifreModalKapat();
            girilenSifre = document.getElementById("newPass1").value.trim();
        } else {
            alert("Şifre değiştirilemedi: " + (res.message || "Hata"));
        }
    }

    function jdeExcelYukle(event) {
        const file = event.target.files[0];
        if (!file) return;

        const statusDiv = document.getElementById("uploadStatus");
        statusDiv.innerHTML = '<div class="spinner"></div><p style="color:var(--primary);">Güncelleniyor...</p>';

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            
            const jsonData = XLSX.utils.sheet_to_json(worksheet, {header: 1});
            if (jsonData.length > 0) jsonData.shift();

            scriptTemizle();
            const payload = encodeURIComponent(JSON.stringify(jsonData));
            const script = document.createElement('script');
            script.className = 'jsonp-temp';
            script.src = API_URL + "?action=upload&excelData=" + payload + "&callback=uploadTamamlandi";
            document.body.appendChild(script);
        };
        reader.readAsArrayBuffer(file);
    }

    function uploadTamamlandi(res) {
        scriptTemizle();
        const statusDiv = document.getElementById("uploadStatus");
        if (res && res.status === "success") {
            statusDiv.innerHTML = '<div style="color:var(--success); font-weight:700;"><i class="fa-solid fa-circle-check"></i> Güncellendi!</div>';
            alert("Google Sheets JDE verileriyle güncellendi!");
        } else {
            statusDiv.innerHTML = '<div style="color:var(--danger); font-weight:700;">Hata!</div>';
            alert("Hata: " + (res.message || "Bilinmeyen hata"));
        }
    }

    function veriGeriDonusIsle(data) {
        scriptTemizle();
        if (data.error) {
            alert("Erişim Engellendi: " + data.error);
            location.reload();
            return;
        }

        mevcutIsler = data;
        kartlariEkranaBas();
    }

    function kartlariEkranaBas() {
        var html = "";
        var aramaMetni = document.getElementById("aramaKutusu") ? document.getElementById("aramaKutusu").value.toLowerCase() : "";
        
        var filtrelenmis = mevcutIsler.filter(function(is) {
            var fDurum = formatVeri(is.firmadurumu);
            var aramaUyum = (
                formatVeri(is.sprsno).toLowerCase().includes(aramaMetni) ||
                formatVeri(is.tanim).toLowerCase().includes(aramaMetni) ||
                formatVeri(is.ilgiliNo).toLowerCase().includes(aramaMetni)
            );
            
            var durumUyum = true;
            if (aktifDurumFiltresi === "Bekliyor") durumUyum = (fDurum === "Bekliyor");
            else if (aktifDurumFiltresi === "Uretimde") durumUyum = (fDurum === "Uretimde" || fDurum === "Üretimde");
            else if (aktifDurumFiltresi === "Bitti") durumUyum = (fDurum === "Bitti");

            return aramaUyum && durumUyum;
        });

        document.getElementById("totalCount").innerText = "(" + filtrelenmis.length + " / " + mevcutIsler.length + " Kalem)";

        if(filtrelenmis.length === 0) {
            html = '<div style="background-color:#fff; border:1px solid var(--border-color); padding:16px; border-radius:8px; text-align:center; color:var(--text-muted); font-size:13px;">Uygun iş emri bulunamadı.</div>';
        } else {
            filtrelenmis.forEach(function(is) {
                var cardId = formatVeri(is.id);
                var fDurum = formatVeri(is.firmadurumu);
                var miktar = is.uretilendir_miktar ? formatVeri(is.uretilendir_miktar) : "0";
                var notIcerigi = is.yansanayinotu ? formatVeri(is.yansanayinotu) : "";
                var spTarihFormatli = formatTarihEkrana(is.sprstarihi);
                var gecenGun = sprsGecenGunHesapla(is.sprstarihi);
                var teslimTarihRaw = is.teslimtarihi && is.teslimtarihi !== "-" ? is.teslimtarihi : "";
                var ilgiliNo = is.ilgiliNo ? formatVeri(is.ilgiliNo) : "-";

                var badgeClass = "badge-bekliyor";
                if(fDurum === "Uretimde" || fDurum === "Üretimde") badgeClass = "badge-uretimde";
                if(fDurum === "Bitti") badgeClass = "badge-bitti";

                // Kaç gündür beklediği eklendi
                html += '<div class="card" id="card_' + cardId + '">' +
                    '<div class="d-flex justify-content-between align-items-center mb-1">' +
                        '<div class="d-flex align-items-center gap-2">' +
                            '<span class="badge ' + badgeClass + '">' + fDurum + '</span>' +
                            '<strong style="color:var(--text-main); font-size:14px;">' + formatVeri(is.tanim) + '</strong>' +
                            '<span class="info-pill">Sp Tp: <b>' + formatVeri(is.sptp) + '</b></span>' +
                            '<span class="info-pill">Sp No: <b>' + formatVeri(is.sprsno) + '</b></span>' +
                            '<span class="info-pill">İlgili No: <b style="color:var(--primary);">' + ilgiliNo + '</b></span>' +
                        '</div>' +
                        '<div class="d-flex align-items-center gap-2">' +
                            '<span style="font-size:11px; color:var(--text-muted);">Sprş Tar: ' + spTarihFormatli + '</span>' +
                            '<span class="info-pill" style="background:#fff7ed; color:#c2410c; border-color:#ffedd5; font-weight:700;"><i class="fa-regular fa-clock"></i> ' + gecenGun + '</span>' +
                            '<span class="info-pill" style="background:#e0e7ff; color:var(--primary); font-weight:700;">Bakiye: ' + formatVeri(is.ob) + '</span>' +
                        '</div>' +
                    '</div>' +

                    '<div class="d-flex gap-2 align-items-center" style="margin-top:6px;">' +
                        '<div style="width:130px;">' +
                            '<select id="durum_' + cardId + '" class="form-select" onchange="degisiklikVurgula(\'' + cardId + '\')">' +
                                '<option value="Bekliyor" ' + (fDurum=='Bekliyor'?'selected':'') + '>Bekliyor</option>' +
                                '<option value="Uretimde" ' + (fDurum=='Uretimde' || fDurum=='Üretimde'?'selected':'') + '>Üretimde</option>' +
                                '<option value="Bitti" ' + (fDurum=='Bitti'?'selected':'') + '>Bitti</option>' +
                            '</select>' +
                        '</div>' +
                        '<div style="width:90px;">' +
                            '<input type="number" id="adet_' + cardId + '" class="form-control" placeholder="Miktar" value="' + miktar + '" oninput="degisiklikVurgula(\'' + cardId + '\')">' +
                        '</div>' +
                        '<div style="width:130px;">' +
                            '<input type="date" id="teslim_' + cardId + '" class="form-control" value="' + teslimTarihRaw + '" onchange="degisiklikVurgula(\'' + cardId + '\')">' +
                        '</div>' +
                        '<div style="flex:1;">' +
                            '<input type="text" id="not_' + cardId + '" class="form-control" placeholder="Not ekleyin..." value="' + notIcerigi + '" oninput="degisiklikVurgula(\'' + cardId + '\')">' +
                        '</div>' +
                    '</div>' +
                '</div>';
            });
        }
        document.getElementById("isKartlari").innerHTML = html;
    }

    function degisiklikVurgula(cardId) {
        const cardElem = document.getElementById("card_" + cardId);
        if (cardElem) cardElem.classList.add("modified");
    }

    function kartlariFiltrele() { kartlariEkranaBas(); }
    
    function durumFiltrele(durum, btnElem) {
        aktifDurumFiltresi = durum;
        document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
        btnElem.classList.add('active');
        kartlariEkranaBas();
    }

    function excelIndir() {
        if (mevcutIsler.length === 0) return alert("İndirilecek veri yok.");
        
        var excelData = mevcutIsler.map(function(is) {
            return {
                "Satır No": is.id,
                "Sipariş No": is.sprsno,
                "İlgili No": is.ilgiliNo,
                "Tanım": is.tanim,
                "Bakiye": is.ob,
                "Sipariş Tarihi": is.sprstarihi,
                "Bekleyen Gün": sprsGecenGunHesapla(is.sprstarihi),
                "Teslim Tarihi": is.teslimtarihi,
                "Firma Durumu": is.firmadurumu,
                "Üretilen Miktar": is.uretilendir_miktar,
                "Yan Sanayi Notu": is.yansanayinotu
            };
        });

        var worksheet = XLSX.utils.json_to_sheet(excelData);
        var workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "İş Listesi");
        XLSX.writeFile(workbook, aktifFirma + "_Is_Listesi.xlsx");
    }

    function topluKaydet() {
        if (mevcutIsler.length === 0) return alert("Kaydedilecek veri yok.");
        
        let guncellenecekler = [];
        const degisenKartlar = document.querySelectorAll('.card.modified');
        
        if (degisenKartlar.length === 0) {
            return alert("Herhangi bir değişiklik yapmadınız.");
        }

        degisenKartlar.forEach(function(kart) {
            var cardId = kart.id.replace('card_', '');
            guncellenecekler.push({
                id: cardId,
                durum: document.getElementById("durum_" + cardId).value,
                adet: document.getElementById("adet_" + cardId).value,
                teslimTarihi: document.getElementById("teslim_" + cardId).value,
                not: document.getElementById("not_" + cardId).value
            });
        });

        const btn = document.getElementById("btnTopluKaydet");
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Kaydediliyor...';
        btn.disabled = true;

        scriptTemizle();
        const payload = encodeURIComponent(JSON.stringify(guncellenecekler));
        const script = document.createElement('script');
        script.className = 'jsonp-temp';
        script.src = API_URL + "?action=update&data=" + payload + "&callback=kayitTamamlandi";
        document.body.appendChild(script);
    }

    function kayitTamamlandi(res) {
        scriptTemizle();
        const btn = document.getElementById("btnTopluKaydet");
        btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Toplu Kaydet';
        btn.disabled = false;

        if (res && res.status === "success") {
            alert("Güncellemeler başarıyla kaydedildi!");
            isleriListele(aktifFirma, girilenSifre);
        } else {
            alert("Kayıt sırasında bir hata oluştu: " + (res.message || "Bilinmeyen hata"));
        }
    }
</script>
</body>
</html>
