<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yan Sanayi İş Takip Portalı</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
            --info: #3b82f6;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; }
        body { 
            background-color: var(--bg); 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; 
            padding: 0; 
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 980px; margin: 0 auto; padding: 32px 20px; }
        
        .card { 
            background-color: var(--card-bg); 
            border-radius: 12px; 
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05); 
            border: 1px solid var(--border-color);
            margin-bottom: 20px; 
            padding: 20px 24px; 
            border-left: 6px solid var(--primary); 
            transition: all 0.2s ease-in-out; 
        }
        .card:hover {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }
        .card.modified { 
            border-left-color: var(--warning) !important; 
            background-color: #fffbeb; 
            border-color: #fde68a;
        }

        .form-control, .form-select { 
            display: block; 
            width: 100%; 
            padding: 10px 14px; 
            font-size: 14px; 
            font-family: inherit;
            color: var(--text-main);
            background-color: #fff;
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            margin-bottom: 12px; 
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }
        .form-control:focus, .form-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .btn { 
            display: inline-flex; 
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 600; 
            padding: 10px 18px; 
            font-size: 14px; 
            border-radius: 8px; 
            border: none; 
            cursor: pointer; 
            color: #fff; 
            transition: all 0.15s ease;
        }
        .btn:hover { transform: translateY(-1px); opacity: 0.95; }
        .btn-primary { background-color: var(--primary); width: 100%; font-size: 16px; padding: 12px; }
        .btn-success { background-color: var(--success); }
        .btn-excel { background-color: #059669; }
        .btn-danger { background-color: var(--danger); }
        
        .btn-filter { 
            background-color: #f1f5f9; 
            color: var(--text-muted); 
            padding: 7px 14px; 
            font-size: 13px; 
            font-weight: 600; 
            border-radius: 20px; 
            border: 1px solid var(--border-color); 
            cursor: pointer; 
            transition: all 0.15s ease;
        }
        .btn-filter:hover { background-color: #e2e8f0; }
        .btn-filter.active { background-color: var(--primary); color: #fff; border-color: var(--primary); }

        .d-none { display: none !important; }
        .d-flex { display: flex !important; }
        .justify-content-between { justify-content: space-between !important; }
        .align-items-center { align-items: center !important; }
        .gap-2 { gap: 8px !important; }
        
        .badge { 
            display: inline-block; 
            padding: 4px 10px; 
            font-size: 11px; 
            font-weight: 700; 
            border-radius: 6px; 
            margin-bottom: 8px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-bekliyor { background-color: #fef3c7; color: #d97706; }
        .badge-uretimde { background-color: #dbeafe; color: #2563eb; }
        .badge-bitti { background-color: #d1fae5; color: #059669; }

        .info-block { 
            background: #f1f5f9; 
            padding: 8px 12px; 
            border-radius: 6px; 
            font-size: 13px; 
            color: var(--text-main); 
            border: 1px solid #e2e8f0;
        }

        .sticky-top-panel { 
            position: sticky; 
            top: 0; 
            background: rgba(248, 250, 252, 0.85); 
            backdrop-filter: blur(8px);
            z-index: 1000; 
            padding: 16px 0; 
            border-bottom: 1px solid var(--border-color); 
            margin-bottom: 24px;
        }

        .spinner { 
            border: 3px solid rgba(79, 70, 229, 0.1); 
            width: 36px; 
            height: 36px; 
            border-radius: 50%; 
            border-left-color: var(--primary); 
            animation: spin 0.8s linear infinite; 
            margin: 20px auto; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="container">
    <div class="text-center mb-4" id="headerSection" style="margin-bottom:32px;">
        <h2 style="color:var(--primary); font-weight:700; font-size:28px; margin:0 0 8px 0;"><i class="fa-solid fa-boxes-stacked"></i> Yan Sanayi İş Takip Portalı</h2>
        <p style="color:var(--text-muted); margin:0;">Güncel fason siparişlerinizi görüntüleyin ve durum bildirimi yapın.</p>
    </div>

    <div id="loginSection">
        <div class="card" style="max-width: 420px; margin: 40px auto; padding: 32px; border-left: none;">
            <div style="text-align:center; margin-bottom:20px;">
                <i class="fa-solid fa-building-user" style="font-size:40px; color:var(--primary);"></i>
                <h3 style="margin:12px 0 4px 0;">Firma Girişi</h3>
                <small style="color:var(--text-muted);">Devam etmek için firma adınızı girin</small>
            </div>
            <label style="font-weight:600; font-size:14px; margin-bottom:8px; display:block;">Tedarikçi Adı:</label>
            <input type="text" id="firmaAdi" class="form-control" placeholder="Firma adınızı yazın...">
            <button onclick="isleriListele()" id="btnListele" class="btn btn-primary"><i class="fa-solid fa-right-to-bracket"></i> İşlerimi Listele</button>
        </div>
    </div>

    <div id="listSection" class="d-none">
        <div class="sticky-top-panel">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div>
                    <h3 id="welcomeText" style="margin:0; color:var(--text-main); font-weight:700;"></h3>
                    <small style="color:var(--text-muted);" id="totalCount"></small>
                </div>
                <div class="d-flex gap-2">
                    <button onclick="excelIndir()" class="btn btn-excel"><i class="fa-solid fa-file-excel"></i> Excel İndir</button>
                    <button onclick="topluKaydet()" id="btnTopluKaydet" class="btn btn-success"><i class="fa-solid fa-floppy-disk"></i> Toplu Kaydet</button>
                    <button onclick="location.reload()" class="btn btn-danger"><i class="fa-solid fa-right-from-bracket"></i> Çıkış</button>
                </div>
            </div>
            
            <div class="d-flex justify-content-between align-items-center gap-2" style="margin-top:14px;">
                <div style="position:relative; flex:1; max-width:300px;">
                    <i class="fa-solid fa-magnifying-glass" style="position:absolute; left:12px; top:12px; color:var(--text-muted); font-size:13px;"></i>
                    <input type="text" id="aramaKutusu" class="form-control" style="margin-bottom:0; padding-left:34px;" placeholder="Sipariş No, Tanım veya İlgili No ara..." oninput="kartlariFiltrele()">
                </div>
                <div class="d-flex gap-2">
                    <button class="btn-filter active" onclick="durumFiltrele('Tumu', this)">Tümü</button>
                    <button class="btn-filter" onclick="durumFiltrele('Bekliyor', this)">Bekleyenler</button>
                    <button class="btn-filter" onclick="durumFiltrele('Uretimde', this)">Üretimdekiler</button>
                    <button class="btn-filter" onclick="durumFiltrele('Bitti', this)">Bitenler</button>
                </div>
            </div>
        </div>

        <div id="isKartlari"></div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycby9Q6_eENP3-BeWKAIE5xnGmIPx7f5eiWtlI-XSMQ_SEMIsJu2cSr1-yB4ch6x-ooZk/exec"; 

    let aktifFirma = "";
    let mevcutIsler = [];
    let aktifDurumFiltresi = "Tumu";

    function scriptTemizle() {
        const tempScripts = document.querySelectorAll('.jsonp-temp');
        tempScripts.forEach(s => s.remove());
    }

    function formatVeri(deger) {
        if (deger === undefined || deger === null) return "-";
        var str = String(deger).trim();
        return str === "" ? "-" : str;
    }

    function formatTarihEkrana(tarihStr) {
        if (!tarihStr || tarihStr === "-" || tarihStr === "undefined") return "-";
        try {
            var str = String(tarihStr).trim();
            if (str.includes("T")) str = str.split("T")[0];
            
            var parts = str.split("-");
            if (parts.length === 3) {
                return parts[2] + "." + parts[1] + "." + parts[0];
            }
            return str;
        } catch(e) { return tarihStr; }
    }

    function isleriListele() {
        aktifFirma = document.getElementById("firmaAdi").value.trim();
        if(!aktifFirma) return alert("Lütfen tedarikçi adınızı girin.");
        
        document.getElementById("loginSection").classList.add("d-none");
        document.getElementById("listSection").classList.remove("d-none");
        document.getElementById("headerSection").classList.add("d-none");
        document.getElementById("welcomeText").innerText = aktifFirma.toUpperCase() + " İŞ LİSTESİ";
        document.getElementById("isKartlari").innerHTML = '<div class="text-center" style="padding:40px;"><div class="spinner"></div><p style="color:var(--text-muted);">İşleriniz yükleniyor, lütfen bekleyin...</p></div>';

        scriptTemizle();
        const script = document.createElement('script');
        script.className = 'jsonp-temp';
        script.src = API_URL + "?action=read&firma=" + encodeURIComponent(aktifFirma) + "&callback=veriGeriDonusIsle";
        document.body.appendChild(script); 
    }

    function veriGeriDonusIsle(data) {
        scriptTemizle();
        if (data.error) {
            alert("Hata: " + data.error);
            document.getElementById("isKartlari").innerHTML = '<div style="color:var(--danger); text-align:center;">Sayfa yüklenirken hata oluştu.</div>';
            return;
        }

        mevcutIsler = data;
        kartlariEkranaBas();
    }

    function kartlariEkranaBas() {
        var html = "";
        var aramaMetni = document.getElementById("aramaKutusu") ? document.getElementById("aramaKutusu").value.toLowerCase() : "";
        
        var filtrelenmis = mevcutIsler.filter(function(is) {
            var fDurum = formatVeri(is.firmadurumu);
            var aramaUyum = (
                formatVeri(is.sprsno).toLowerCase().includes(aramaMetni) ||
                formatVeri(is.tanim).toLowerCase().includes(aramaMetni) ||
                formatVeri(is.ilgiliNo).toLowerCase().includes(aramaMetni)
            );
            
            var durumUyum = true;
            if (aktifDurumFiltresi === "Bekliyor") durumUyum = (fDurum === "Bekliyor");
            else if (aktifDurumFiltresi === "Uretimde") durumUyum = (fDurum === "Uretimde" || fDurum === "Üretimde");
            else if (aktifDurumFiltresi === "Bitti") durumUyum = (fDurum === "Bitti");

            return aramaUyum && durumUyum;
        });

        document.getElementById("totalCount").innerText = "Gösterilen Kalem Sayısı: " + filtrelenmis.length + " / Toplam: " + mevcutIsler.length;

        if(filtrelenmis.length === 0) {
            html = '<div style="background-color:#fff; border:1px solid var(--border-color); padding:32px; border-radius:12px; text-align:center; color:var(--text-muted);"><i class="fa-solid fa-inbox" style="font-size:32px; margin-bottom:8px; display:block;"></i>Arama kriterlerinize uygun iş emri bulunamadı.</div>';
        } else {
            filtrelenmis.forEach(function(is) {
                var cardId = formatVeri(is.id);
                var fDurum = formatVeri(is.firmadurumu);
                var miktar = is.uretilendir_miktar ? formatVeri(is.uretilendir_miktar) : "0";
                var notIcerigi = is.yansanayinotu ? formatVeri(is.yansanayinotu) : "";
                var spTarihFormatli = formatTarihEkrana(is.sprstarihi);
                var teslimTarihRaw = is.teslimtarihi && is.teslimtarihi !== "-" ? is.teslimtarihi : "";
                var ilgiliNo = is.ilgiliNo ? formatVeri(is.ilgiliNo) : "-";

                var badgeClass = "badge-bekliyor";
                if(fDurum === "Uretimde" || fDurum === "Üretimde") badgeClass = "badge-uretimde";
                if(fDurum === "Bitti") badgeClass = "badge-bitti";

                html += '<div class="card" id="card_' + cardId + '">' +
                    '<div class="d-flex justify-content-between align-items-center">' +
                        '<div>' +
                            '<span class="badge ' + badgeClass + '">' + fDurum + '</span>' +
                            '<h4 style="margin:2px 0 6px 0; font-weight:700; color:var(--text-main); font-size:17px;">' + formatVeri(is.tanim) + '</h4>' +
                            '<small style="color:var(--text-muted); font-size:13px;">Sipariş No: <b>' + formatVeri(is.sprsno) + '</b> | Satır No: <b>' + cardId + '</b> | İlgili No: <b style="color:var(--primary);">' + ilgiliNo + '</b></small>' +
                        '</div>' +
                        '<div style="text-align:right;">' +
                            '<small style="color:var(--text-muted); display:block; font-size:12px;">Kalan Bakiye</small>' +
                            '<span style="font-size:22px; font-weight:700; color:var(--primary);">' + formatVeri(is.ob) + '</span>' +
                        '</div>' +
                    '</div>' +

                    '<div style="display:flex; gap:12px; margin:14px 0;">' +
                        '<div style="flex:1;"><div class="info-block"><i class="fa-solid fa-tag" style="color:var(--text-muted);"></i> <b>Sp Tp:</b> ' + formatVeri(is.sptp) + '</div></div>' +
                        '<div style="flex:1;"><div class="info-block"><i class="fa-regular fa-calendar" style="color:var(--text-muted);"></i> <b>Sprş Tarihi:</b> ' + spTarihFormatli + '</div></div>' +
                    '</div>' +

                    '<div style="display:flex; gap:12px; align-items:flex-end; margin-top:14px;">' +
                        '<div style="flex:1;">' +
                            '<label style="font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:4px; display:block;">Firma Durumu</label>' +
                            '<select id="durum_' + cardId + '" class="form-select" style="margin-bottom:0;" onchange="degisiklikVurgula(\'' + cardId + '\')">' +
                                '<option value="Bekliyor" ' + (fDurum=='Bekliyor'?'selected':'') + '>Bekliyor</option>' +
                                '<option value="Uretimde" ' + (fDurum=='Uretimde' || fDurum=='Üretimde'?'selected':'') + '>Üretimde</option>' +
                                '<option value="Bitti" ' + (fDurum=='Bitti'?'selected':'') + '>Bitti</option>' +
                            '</select>' +
                        '</div>' +
                        '<div style="flex:1;">' +
                            '<label style="font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:4px; display:block;">Üretilen Miktar</label>' +
                            '<input type="number" id="adet_' + cardId + '" class="form-control" style="margin-bottom:0;" value="' + miktar + '" oninput="degisiklikVurgula(\'' + cardId + '\')">' +
                        '</div>' +
                        '<div style="flex:1;">' +
                            '<label style="font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:4px; display:block;">Teslim Tarihi</label>' +
                            '<input type="date" id="teslim_' + cardId + '" class="form-control" style="margin-bottom:0;" value="' + teslimTarihRaw + '" onchange="degisiklikVurgula(\'' + cardId + '\')">' +
                        '</div>' +
                    '</div>' +

                    '<div style="margin-top:12px;">' +
                        '<label style="font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:4px; display:block;">Yan Sanayi Notu</label>' +
                        '<input type="text" id="not_' + cardId + '" class="form-control" style="margin-bottom:0;" placeholder="İmalat/sevkiyat durumu hakkında not ekleyin..." value="' + notIcerigi + '" oninput="degisiklikVurgula(\'' + cardId + '\')">' +
                    '</div>' +
                '</div>';
            });
        }
        document.getElementById("isKartlari").innerHTML = html;
    }

    function degisiklikVurgula(cardId) {
        const cardElem = document.getElementById("card_" + cardId);
        if (cardElem) cardElem.classList.add("modified");
    }

    function kartlariFiltrele() { kartlariEkranaBas(); }
    
    function durumFiltrele(durum, btnElem) {
        aktifDurumFiltresi = durum;
        document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
        btnElem.classList.add('active');
        kartlariEkranaBas();
    }

    function excelIndir() {
        if (mevcutIsler.length === 0) return alert("İndirilecek veri yok.");
        
        var excelData = mevcutIsler.map(function(is) {
            return {
                "Satır No": is.id,
                "Sipariş No": is.sprsno,
                "İlgili No": is.ilgiliNo,
                "Tanım": is.tanim,
                "Bakiye": is.ob,
                "Sipariş Tarihi": is.sprstarihi,
                "Teslim Tarihi": is.teslimtarihi,
                "Firma Durumu": is.firmadurumu,
                "Üretilen Miktar": is.uretilendir_miktar,
                "Yan Sanayi Notu": is.yansanayinotu
            };
        });

        var worksheet = XLSX.utils.json_to_sheet(excelData);
        var workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "İş Listesi");
        XLSX.writeFile(workbook, aktifFirma + "_Is_Listesi.xlsx");
    }

    function topluKaydet() {
        if (mevcutIsler.length === 0) return alert("Kaydedilecek veri yok.");
        
        let guncellenecekler = [];
        const degisenKartlar = document.querySelectorAll('.card.modified');
        
        if (degisenKartlar.length === 0) {
            return alert("Herhangi bir değişiklik yapmadınız.");
        }

        degisenKartlar.forEach(function(kart) {
            var cardId = kart.id.replace('card_', '');
            guncellenecekler.push({
                id: cardId,
                durum: document.getElementById("durum_" + cardId).value,
                adet: document.getElementById("adet_" + cardId).value,
                teslimTarihi: document.getElementById("teslim_" + cardId).value,
                not: document.getElementById("not_" + cardId).value
            });
        });

        const btn = document.getElementById("btnTopluKaydet");
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Kaydediliyor...';
        btn.disabled = true;

        scriptTemizle();
        const payload = encodeURIComponent(JSON.stringify(guncellenecekler));
        const script = document.createElement('script');
        script.className = 'jsonp-temp';
        script.src = API_URL + "?action=update&data=" + payload + "&callback=kayitTamamlandi";
        document.body.appendChild(script);
    }

    function kayitTamamlandi(res) {
        scriptTemizle();
        const btn = document.getElementById("btnTopluKaydet");
        btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Toplu Kaydet';
        btn.disabled = false;

        if (res && res.status === "success") {
            alert("Güncellemeler başarıyla kaydedildi!");
            isleriListele();
        } else {
            alert("Kayıt sırasında bir hata oluştu: " + (res.message || "Bilinmeyen hata"));
        }
    }
</script>
</body>
</html>
