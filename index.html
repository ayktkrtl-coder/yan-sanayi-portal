<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yan Sanayi İş Takip Portalı</title>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        .container { max-width: 900px; margin: 0 auto; padding: 24px; }
        .text-center { text-align: center; }
        .mb-4 { margin-bottom: 24px; }
        .fw-bold { font-weight: 700; }
        .text-primary { color: #0d6efd; }
        .text-muted { color: #6c757d; }
        .card { background-color: #fff; border: none; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; padding: 24px; border-left: 5px solid #3498db; }
        .form-control { display: block; width: 100%; padding: 6px 12px; font-size: 16px; border: 1px solid #ced4da; border-radius: 6px; margin-bottom: 16px; }
        .btn { display: inline-block; font-weight: 700; line-height: 1.5; color: #fff; text-align: center; cursor: pointer; padding: 8px 16px; font-size: 16px; border-radius: 6px; border: 1px solid transparent; width: 100%; }
        .btn-primary { background-color: #0d6efd; border-color: #0d6efd; }
        .btn-success { background-color: #198754; border-color: #198754; width: auto; }
        .btn-danger { background-color: #dc3545; border-color: #dc3545; width: auto; }
        .d-none { display: none!important; }
        .d-flex { display: flex!important; }
        .justify-content-between { justify-content: space-between!important; }
        .align-items-center { align-items: center!important; }
        .gap-2 { gap: 8px!important; }
        .badge { display: inline-block; padding: 6px 10px; font-size: 12px; font-weight: 700; border-radius: 12px; margin-bottom: 8px; color: white; background-color: #6c757d; }
        .info-block { background: #f8f9fa; padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 5px; color: #212529; }
        .sticky-top-panel { position: sticky; top: 0; background: rgba(244, 246, 249, 0.95); z-index: 1000; padding: 15px 0; border-bottom: 1px solid #e2e8f0; }
        .form-select { display: block; width: 100%; padding: 4px 8px; font-size: 14px; color: #212529; background-color: #fff; border: 1px solid #ced4da; border-radius: 4px; }
        .spinner { border: 4px solid rgba(0, 0, 0, 0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: #0d6efd; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="container">
    <div class="text-center mb-4" id="headerSection">
        <h2 class="fw-bold text-primary">Yan Sanayi İş Takip Portalı</h2>
        <p class="text-muted">Güncel fason siparişlerinizi görüntüleyin ve durum bildirimi yapın.</p>
    </div>

    <!-- Giriş Ekranı -->
    <div id="loginSection">
        <div class="card" style="max-width: 450px; margin: 0 auto;">
            <label class="fw-bold" style="margin-bottom:8px; display:block;">Tedarikçi Adınızı Girin:</label>
            <input type="text" id="firmaAdi" class="form-control" placeholder="Örn: EMO">
            <button onclick="isleriListele()" id="btnListele" class="btn btn-primary">İşlerimi Listele</button>
        </div>
    </div>

    <!-- İş Listesi Üst Sabit Panel -->
    <div id="listSection" class="d-none">
        <div class="sticky-top-panel">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h4 id="welcomeText" class="fw-bold" style="margin:0; color:#212529;"></h4>
                    <small class="text-muted" id="totalCount"></small>
                </div>
                <div class="d-flex gap-2">
                    <button onclick="topluKaydet()" id="btnTopluKaydet" class="btn btn-success">Toplu Kaydet</button>
                    <button onclick="location.reload()" class="btn btn-danger">Çıkış</button>
                </div>
            </div>
        </div>
        <div id="isKartlari" style="margin-top:16px;"></div>
    </div>
</div>

<script>
    // ⚠️ 1. ADIMDA GOOGLE'DAN ALDIĞINIZ YENİ WEB URL'SİNİ AŞAĞIDAKİ TIRNAKLARIN İÇİNE YAPIŞTIRIN:
    const API_URL = "https://script.google.com/macros/s/AKfycby1kAIhswd9cRDDue25ueBVetiyV_6QV2VpC2jFmzQawBsqG2nJUSnr4u157ZIwztCm/exec"; 

    let aktifFirma = "";
    let mevcutIsler = [];

    function isleriListele() {
        aktifFirma = document.getElementById("firmaAdi").value.trim();
        if(!aktifFirma) return alert("Lütfen tedarikçi adınızı girin.");
        
        document.getElementById("loginSection").classList.add("d-none");
        document.getElementById("listSection").classList.remove("d-none");
        document.getElementById("headerSection").classList.add("d-none");
        document.getElementById("isKartlari").innerHTML = '<div class="text-center"><div class="spinner"></div><p>İşleriniz yükleniyor...</p></div>';

        // Güvenli JSONP Tüneli bağlantısı (CORS engelini kökten aşar)
        const script = document.createElement('script');
        script.src = API_URL + "?action=read&firma=" + encodeURIComponent(aktifFirma) + "&callback=veriGeriDonusIsle";
        document.body.appendChild(script); 
    }

    function veriGeriDonusIsle(data) {
        mevcutIsler = data;
        let html = "";
        document.getElementById("totalCount").innerText = "Toplam Kalem Sayısı: " + data.length;
        
        if(!data || data.length === 0) {
            html = '<div style="background-color:#fff3cd; padding:16px; border-radius:6px; text-align:center;">Aktif iş emri bulunamadı.</div>';
            document.getElementById("btnTopluKaydet").classList.add("d-none");
        } else {
            document.getElementById("btnTopluKaydet").classList.remove("d-none");
            data.forEach((is) => {
                html += '<div class="card">' +
                    '<div class="d-flex justify-content-between">' +
                        '<div>' +
                            '<span class="badge">' + (is.firmadurumu || "Bekliyor") + '</span>' +
                            '<h5 class="fw-bold" style="margin:4px 0;">' + (is.tanim || "-") + '</h5>' +
                            '<small class="text-muted">Sipariş No: ' + (is.sprsno || "-") + ' | Satır: ' + (is.strno || "-") + '</small>' +
                        '</div>' +
                        '<div style="text-align:right;">' +
                            '<small class="text-muted" style="display:block;">Bakiye</small>' +
                            '<span class="text-primary" style="font-size:20px; font-weight:bold;">' + (is.ob || "0") + '</span>' +
                        '</div>' +
                    '</div>' +
                    '<div style="display:flex; gap:8px; margin:12px 0;">' +
                        '<div style="flex:1;"><div class="info-block"><b>Tip:</b> ' + (is.sptp || "-") + '</div></div>' +
                        '<div style="flex:1;"><div class="info-block"><b>Sip.Tarihi:</b> ' + (is.sprstarihi || "-") + '</div></div>' +
                        '<div style="flex:1;"><div class="info-block"><b>Teslim:</b> ' + (is.teslimtarihi || "-") + '</div></div>' +
                    '</div>' +
                    '<div style="display:flex; gap:8px; align-items:flex-end; margin-top:12px;">' +
                        '<div style="flex:1;">' +
                            '<select id="durum_' + is.id + '" class="form-select">' +
                                '<option value="Bekliyor" ' + (is.firmadurumu=='Bekliyor'?'selected':'') + '>Bekliyor</option>' +
                                '<option value="Üretimde" ' + (is.firmadurumu=='Üretimde'?'selected':'') + '>Üretimde</option>' +
                                '<option value="Bitti" ' + (is.firmadurumu=='Bitti'?'selected':'') + '>Bitti</option>' +
                            '</select>' +
                        '</div>' +
                        '<div style="flex:1;">' +
                            '<input type="number" id="adet_' + is.id + '" class="form-control" style="margin:0;" value="' + (is.uretilendir_miktar || 0) + '">' +
                        '</div>' +
                        '<div style="flex:2;">' +
                            '<input type="text" id="not_' + is.id + '" class="form-control" style="margin:0;" value="' + (is.yansanayinotu || "") + '" placeholder="Not ekleyin">' +
                        '</div>' +
                    '</div>' +
                '</div>';
            });
        }
        document.getElementById("welcomeText").innerText = "Tedarikçi: " + aktifFirma;
        document.getElementById("isKartlari").innerHTML = html;
    }

    function topluKaydet() {
        let guncellenecekler = [];
        mevcutIsler.forEach((is) => {
            let durum = document.getElementById("durum_" + is.id).value;
            let adet = document.getElementById("adet_" + is.id).value;
            let not = document.getElementById("not_" + is.id).value;
            
            guncellenecekler.push({
                id: is.id,
                firmaDurumu: durum,
                uretilenMiktar: adet,
                yanSanayiNotu: not
            });
        });

        const btnSave = document.getElementById("btnTopluKaydet");
        btnSave.disabled = true;
        btnSave.innerText = "⏳ Kaydediliyor...";

        fetch(API_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "update", rows: guncellenecekler })
        }).then(() => {
            alert("Değişiklikler Google Etabloya başarıyla kaydedildi!");
            btnSave.disabled = false;
            btnSave.innerText = "Toplu Kaydet";
            isleriListele();
        }).catch(err => {
            alert("Hata: " + err);
            btnSave.disabled = false;
            btnSave.innerText = "Toplu Kaydet";
