<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yan Sanayi Is Takip Portali</title>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #f4f6f9; font-family: sans-serif; margin: 0; padding: 0; }
        .container { max-width: 900px; margin: 0 auto; padding: 24px; }
        .card { background-color: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; padding: 24px; border-left: 5px solid #3498db; }
        .form-control { display: block; width: 100%; padding: 8px; font-size: 16px; border: 1px solid #ced4da; border-radius: 6px; margin-bottom: 16px; }
        .btn { display: inline-block; font-weight: 700; padding: 10px 20px; font-size: 16px; border-radius: 6px; border: none; cursor: pointer; color: #fff; width: 100%; }
        .btn-primary { background-color: #0d6efd; }
        .btn-success { background-color: #198754; width: auto; }
        .btn-danger { background-color: #dc3545; width: auto; }
        .d-none { display: none !important; }
        .d-flex { display: flex !important; }
        .justify-content-between { justify-content: space-between !important; }
        .align-items-center { align-items: center !important; }
        .gap-2 { gap: 8px !important; }
        .badge { display: inline-block; padding: 6px 10px; font-size: 12px; font-weight: 700; border-radius: 12px; margin-bottom: 8px; color: white; background-color: #6c757d; }
        .info-block { background: #f8f9fa; padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 5px; color: #212529; }
        .sticky-top-panel { position: sticky; top: 0; background: rgba(244, 246, 249, 0.95); z-index: 1000; padding: 15px 0; border-bottom: 1px solid #e2e8f0; }
        .form-select { display: block; width: 100%; padding: 6px; font-size: 14px; border: 1px solid #ced4da; border-radius: 4px; }
        .spinner { border: 4px solid rgba(0, 0, 0, 0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: #0d6efd; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="container">
    <div class="text-center mb-4" id="headerSection">
        <h2 style="color:#0d6efd;">Yan Sanayi Is Takip Portali</h2>
        <p style="color:#6c757d;">Guncel fason siparislerinizi goruntuleyin ve durum bildirimi yapin.</p>
    </div>

    <div id="loginSection">
        <div class="card" style="max-width: 450px; margin: 0 auto;">
            <label style="font-weight:700; margin-bottom:8px; display:block;">Tedarikci Adinizi Girin:</label>
            <input type="text" id="firmaAdi" class="form-control" placeholder="Orn: EMO">
            <button onclick="isleriListele()" id="btnListele" class="btn btn-primary">Islerimi Listele</button>
        </div>
    </div>

    <div id="listSection" class="d-none">
        <div class="sticky-top-panel">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h4 id="welcomeText" style="margin:0; color:#212529; font-weight:700;"></h4>
                    <small style="color:#6c757d;" id="totalCount"></small>
                </div>
                <div class="d-flex gap-2">
                    <button onclick="topluKaydet()" id="btnTopluKaydet" class="btn btn-success">Toplu Kaydet</button>
                    <button onclick="location.reload()" class="btn btn-danger">Cikis</button>
                </div>
            </div>
        </div>
        <div id="isKartlari" style="margin-top:16px;"></div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycby5GZ_7rCzMOEOXN6Cqg8z1aGuHO1zJ8VoVjk5AYjl8i05FBZlNggdFQilL9HFaLFk/exec"; 

    let aktifFirma = "";
    let mevcutIsler = [];

    function formatVeri(deger) {
        if (deger === undefined || deger === null) return "-";
        try {
            var str = String(deger).trim();
            if (str.includes("T") && str.includes("Z")) {
                return str.split("T")[0]; 
            }
            return str;
        } catch(e) {
            return "-";
        }
    }

    function isleriListele() {
        aktifFirma = document.getElementById("firmaAdi").value.trim();
        if(!aktifFirma) return alert("Lutfen tedarikci adinizi girin.");
        
        document.getElementById("loginSection").classList.add("d-none");
        document.getElementById("listSection").classList.remove("d-none");
        document.getElementById("headerSection").classList.add("d-none");
        document.getElementById("isKartlari").innerHTML = '<div class="text-center"><div class="spinner"></div><p>Isleriniz yukleniyor...</p></div>';

        const script = document.createElement('script');
        script.src = API_URL + "?action=read&firma=" + encodeURIComponent(aktifFirma) + "&callback=veriGeriDonusIsle";
        document.body.appendChild(script); 
    }

    function veriGeriDonusIsle(data) {
        mevcutIsler = data;
        var html = "";
        document.getElementById("totalCount").innerText = "Toplam Kalem Sayisi: " + data.length;
        
        if(!data || data.length === 0) {
            html = '<div style="background-color:#fff3cd; padding:16px; border-radius:6px; text-align:center;">Aktif is emri bulunamadi.</div>';
            document.getElementById("btnTopluKaydet").classList.add("d-none");
        } else {
            document.getElementById("btnTopluKaydet").classList.remove("d-none");
            data.forEach(function(is) {
                var cardId = formatVeri(is.id);
                var fDurum = formatVeri(is.firmadurumu);
                var miktar = is.uretilendir_miktar ? parseInt(formatVeri(is.uretilendir_miktar)) : 0;
                var notIcerigi = is.yansanayinotu ? formatVeri(is.yansanayinotu) : "";
                if(isNaN(miktar)) miktar = 0;

                html += '<div class="card">' +
                    '<div class="d-flex justify-content-between">' +
                        '<div>' +
                            '<span class="badge" style="background-color: #27ae60;">' + fDurum + '</span>' +
                            '<h5 style="margin:4px 0; font-weight:700; color:#2c3e50;">' + formatVeri(is.tanim) + '</h5>' +
                            '<small style="color:#6c757d;">Siparis No: ' + formatVeri(is.sprsno) + ' | Satir No: ' + cardId + '</small>' +
                        '</div>' +
                        '<div style="text-align:right;">' +
                            '<small style="color:#6c757d; display:block;">Bakiye</small>' +
                            '<span style="font-size:20px; font-weight:bold; color:#0d6efd;">' + formatVeri(is.ob) + '</span>' +
                        '</div>' +
                    '</div>' +
                    '<div style="display:flex; gap:8px; margin:12px 0;">' +
                        '<div style="flex:1;"><div class="info-block"><b>Sp Tp:</b> ' + formatVeri(is.sptp) + '</div></div>' +
                        '<div style="flex:1;"><div class="info-block"><b>Sprs Tarihi:</b> ' + formatVeri(is.sprstarihi) + '</div></div>' +
                        '<div style="flex:1;"><div class="info-block"><b>Teslim Tarihi:</b> ' + formatVeri(is.teslimtarihi) + '</div></div>' +
                    '</div>' +
                    '<div style="display:flex; gap:8px; align-items:flex-end; margin-top:12px; margin-bottom:12px;">' +
                        '<div style="flex:1;">' +
                            '<label style="font-size:12px; font-weight:bold; color:#555;">Firma Durumu</label>' +
                            '<select id="durum_' + cardId + '" class="form-select" style="margin-top:4px;">' +
                                '<option value="Bekliyor" ' + (fDurum=='Bekliyor'?'selected':'') + '>Bekliyor</option>' +
                                '<option value="Uretimde" ' + (fDurum=='Uretimde'?'selected':'') + '>Uretimde</option>' +
                                '<option value="Bitti" ' + (fDurum=='Bitti'?'selected':'') + '>Bitti</option>' +
                            '</select>' +
                        '</div>' +
                        '<div style="flex:1;">' +
                            '<label style="font-size:12px; font-weight:bold; color:#555;">Uretilen Miktar</label>' +
                            '<input type="number" id="adet_' + cardId + '" class="form-control" style="margin:4px 0 0 0; padding:5px;" value="' + miktar + '">' +
                        '</div>' +
                    '</div>' +
                    '<div style="margin-top:10px;">' +
                        '<label style="font-size:12px; font-weight:bold; color:#555;">Acıklama / Yan Sanayi Notu</label>' +
                        '<input type="text" id="not_' + cardId + '" class="form-control" style="margin-top:4px; font-size:14px;" placeholder="Notunuzu buraya yazabilirsiniz..." value="' + notIcerigi + '">' +
                    '</div>' +
                '</div>';
            });
        }
        document.getElementById("isKartlari").innerHTML = html;
        document.getElementById("welcomeText").innerText = "Hos Geldiniz, " + aktifFirma;
    }

    function topluKaydet() {
        let guncellenecekler = [];
        mevcutIsler.forEach(function(is) {
            var cardId = formatVeri(is.id);
            var secilenDurum = document.getElementById("durum_" + cardId).value;
            var girilenAdet = document.getElementById("adet_" + cardId).value;
            var girilenNot = document.getElementById("not_" + cardId).value;
            guncellenecekler.push({
                id: cardId,
                durum: secilenDurum,
                adet: girilenAdet,
                not: girilenNot
            });
        });

        document.getElementById("btnTopluKaydet").innerText = "Kaydediliyor...";
