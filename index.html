<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yan Sanayi İş Takip Portalı</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #4f46e5; --bg: #f8fafc; --card-bg: #ffffff; --text-main: #0f172a; --text-muted: #64748b; --border-color: #e2e8f0; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; }
        * { box-sizing: border-box; }
        body { background-color: var(--bg); font-family: 'Inter', sans-serif; margin: 0; padding: 0; color: var(--text-main); }
        .container { max-width: 1200px; margin: 0 auto; padding: 16px 20px; }
        .card { background-color: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 8px; padding: 12px 16px; border-left: 4px solid var(--primary); }
        .card.modified { border-left-color: var(--warning) !important; background-color: #fffbeb; }
        .form-control, .form-select { display: block; width: 100%; padding: 6px 10px; font-size: 13px; border: 1px solid var(--border-color); border-radius: 6px; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; padding: 8px 14px; font-size: 13px; border-radius: 6px; border: none; cursor: pointer; color: #fff; }
        .btn-primary { background-color: var(--primary); width: 100%; font-size: 14px; padding: 10px; }
        .btn-success { background-color: var(--success); }
        .btn-danger { background-color: var(--danger); }
        .d-none { display: none !important; }
        .d-flex { display: flex !important; }
        .justify-content-between { justify-content: space-between !important; }
        .align-items-center { align-items: center !important; }
        .gap-2 { gap: 8px !important; }
        .badge { padding: 3px 8px; font-size: 10px; font-weight: 700; border-radius: 4px; text-transform: uppercase; }
        .badge-bekliyor { background-color: #fef3c7; color: #d97706; }
        .badge-uretimde { background-color: #dbeafe; color: #2563eb; }
        .badge-bitti { background-color: #d1fae5; color: #059669; }
        .info-pill { background-color: #f1f5f9; padding: 3px 8px; border-radius: 4px; font-size: 11px; color: var(--text-muted); border: 1px solid #e2e8f0; }
        .sticky-top { position: sticky; top: 0; background: rgba(248, 250, 252, 0.95); backdrop-filter: blur(8px); z-index: 100; padding: 10px 0; border-bottom: 1px solid var(--border-color); margin-bottom: 12px; }
        .spinner { border: 3px solid rgba(79, 70, 229, 0.1); width: 28px; height: 28px; border-radius: 50%; border-left-color: var(--primary); animation: spin 0.8s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="container">
    <div id="loginSection">
        <div class="card" style="max-width: 380px; margin: 40px auto; padding: 24px; border-left: none;">
            <div style="text-align:center; margin-bottom:16px;">
                <i class="fa-solid fa-building-user" style="font-size:36px; color:var(--primary);"></i>
                <h3 style="margin:10px 0 4px 0;">Portal Girişi</h3>
            </div>
            <label style="font-weight:600; font-size:12px; display:block; margin-bottom:4px;">Firma Adı:</label>
            <input type="text" id="firmaAdi" class="form-control" style="margin-bottom:12px;" placeholder="Örn: EMO MAKINACILIK..." autocomplete="off">
            <button onclick="girisYap()" class="btn btn-primary"><i class="fa-solid fa-right-to-bracket"></i> Giriş Yap</button>
        </div>
    </div>

    <div id="listSection" class="d-none">
        <div class="sticky-top">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <span id="welcomeText" style="font-weight:700; font-size:16px;"></span>
                    <small style="color:var(--text-muted); margin-left:8px;" id="totalCount"></small>
                </div>
                <div class="d-flex gap-2">
                    <button onclick="topluKaydet()" id="btnTopluKaydet" class="btn btn-success"><i class="fa-solid fa-floppy-disk"></i> Değişiklikleri Kaydet</button>
                    <button onclick="location.reload()" class="btn btn-danger"><i class="fa-solid fa-right-from-bracket"></i> Çıkış</button>
                </div>
            </div>
            <div style="margin-top:8px;">
                <input type="text" id="aramaKutusu" class="form-control" placeholder="Sipariş No, Tanım veya İlgili No ara..." oninput="kartlariEkranaBas()">
            </div>
        </div>
        <div id="isKartlari"></div>
    </div>
</div>

<script>
    // BURAYA Kendi Google Apps Script Web Uygulama URL'nizi yapıştırın:
    const API_URL = "https://script.google.com/macros/s/AKfycbzAxCcuYbdIoxVWsUSB8rGbhiN_vYasKW4vvisEsQfaKLiPpxRoLnw72JoEezCR9SKH/exec"; 

    let mevcutIsler = [];
    let aktifFirma = "";

    function jsonpIstek(params, callbackName, onSuccess) {
        const oldScript = document.getElementById('jsonp-script');
        if (oldScript) oldScript.remove();

        window[callbackName] = function(res) {
            onSuccess(res);
        };

        let url = API_URL + "?callback=" + callbackName;
        for (let key in params) {
            url += "&" + key + "=" + encodeURIComponent(params[key]);
        }

        const script = document.createElement('script');
        script.id = 'jsonp-script';
        script.src = url;
        script.onerror = function() { alert("Sunucu bağlantı hatası!"); };
        document.body.appendChild(script);
    }

    function girisYap() {
        aktifFirma = document.getElementById("firmaAdi").value.trim();
        if(!aktifFirma) return alert("Lütfen firma adını yazın.");

        document.getElementById("loginSection").classList.add("d-none");
        document.getElementById("listSection").classList.remove("d-none");
        document.getElementById("welcomeTextinnerText = aktifFirma.toUpperCase() + " İŞ LİSTESİ";
        document.getElementById("isKartlari").innerHTML = '<div class="spinner"></div>';

        jsonpIstek({ action: "read", firma: aktifFirma }, "veriDonus", function(res) {
            if(Array.isArray(res)) {
                mevcutIsler = res;
                kartlariEkranaBas();
            } else {
                alert("Veri yüklenemedi!");
                location.reload();
            }
        });
    }

    function kartlariEkranaBas() {
        var arama = document.getElementById("aramaKutusu").value.toLowerCase();
        var filtrelenmis = mevcutIsler.filter(i => 
            i.sprsNo.toLowerCase().includes(arama) || 
            i.tanim.toLowerCase().includes(arama) || 
            i.ilgiliNo.toLowerCase().includes(arama)
        );

        document.getElementById("totalCount").innerText = "(" + filtrelenmis.length + " Kalem)";
        var html = "";

        filtrelenmis.forEach(function(is) {
            var id = is.id;
            var durum = is.firmaDurumu || "Bekliyor";
            var badgeCls = durum === "Bitti" ? "badge-bitti" : (durum === "Üretimde" || durum === "Uretimde" ? "badge-uretimde" : "badge-bekliyor");

            html += '<div class="card" id="card_' + id + '">' +
                '<div class="d-flex justify-content-between align-items-center mb-1">' +
                    '<div class="d-flex align-items-center gap-2">' +
                        '<span class="badge ' + badgeCls + '">' + durum + '</span>' +
                        '<strong>' + is.tanim + '</strong>' +
                        '<span class="info-pill">Sp No: <b>' + is.sprsNo + '</b></span>' +
                        '<span class="info-pill">İlgili No: <b style="color:var(--primary);">' + is.ilgiliNo + '</b></span>' +
                    '</div>' +
                    '<span class="info-pill" style="background:#e0e7ff; color:var(--primary); font-weight:700;">Bakiye: ' + is.ob + '</span>' +
                '</div>' +
                '<div class="d-flex gap-2 align-items-center" style="margin-top:8px;">' +
                    '<div style="width:130px;"><select id="durum_' + id + '" class="form-select" onchange="isaretle(' + id + ')">' +
                        '<option value="Bekliyor" ' + (durum=='Bekliyor'?'selected':'') + '>Bekliyor</option>' +
                        '<option value="Üretimde" ' + (durum=='Üretimde'||durum=='Uretimde'?'selected':'') + '>Üretimde</option>' +
                        '<option value="Bitti" ' + (durum=='Bitti'?'selected':'') + '>Bitti</option>' +
                    '</select></div>' +
                    '<div style="width:100px;"><input type="number" id="adet_' + id + '" class="form-control" value="' + is.uretilenMiktar + '" oninput="isaretle(' + id + ')"></div>' +
                    '<div style="width:140px;"><input type="date" id="tarih_' + id + '" class="form-control" value="' + is.teslimTarihi.split('T')[0] + '" onchange="isaretle(' + id + ')"></div>' +
                    '<div style="flex:1;"><input type="text" id="not_' + id + '" class="form-control" placeholder="Not..." value="' + is.yansanayiNotu + '" oninput="isaretle(' + id + ')"></div>' +
                '</div>' +
            '</div>';
        });

        document.getElementById("isKartlari").innerHTML = html || '<div style="text-align:center; padding:20px; color:var(--text-muted);">Kayıt bulunamadı.</div>';
    }

    function isaretle(id) {
        document.getElementById("card_" + id).classList.add("modified");
    }

    function topluKaydet() {
        var modifiedCards = document.querySelectorAll('.card.modified');
        if(modifiedCards.length === 0) return alert("Değiştirilen kayıt yok.");

        var guncellenecekler = [];
        modifiedCards.forEach(function(card) {
            var id = card.id.replace('card_', '');
            guncellenecekler.push({
                id: id,
                yeniDurum: document.getElementById("durum_" + id).value,
                yeniMiktar: document.getElementById("adet_" + id).value,
                teslimTarihi: document.getElementById("tarih_" + id).value,
                not: document.getElementById("not_" + id).value
            });
        });

        const btn = document.getElementById("btnTopluKaydet");
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Kaydediliyor...';

        jsonpIstek({ action: "update", data: JSON.stringify(guncellenecekler) }, "kaydetDonus", function(res) {
            btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Değişiklikleri Kaydet';
            if(res && res.status === "success") {
                alert("Değişiklikler başarıyla kaydedildi!");
                girisYap();
            } else {
                alert("Kayıt hatası!");
            }
        });
    }
</script>
</body>
</html>
