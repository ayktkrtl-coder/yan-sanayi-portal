<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yan Sanayi İş Takip Portalı</title>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        .container { max-width: 900px; margin: 0 auto; padding: 24px; }
        .text-center { text-align: center; }
        .mb-4 { margin-bottom: 24px; }
        .fw-bold { font-weight: 700; }
        .text-primary { color: #0d6efd; }
        .text-muted { color: #6c757d; }
        .row { display: flex; flex-wrap: wrap; margin-right: -12px; margin-left: -12px; }
        .justify-content-center { justify-content: center; }
        .card { position: relative; display: flex; flex-direction: column; min-width: 0; background-color: #fff; border: none; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; padding: 24px; border-left: 5px solid #3498db; }
        .form-label { margin-bottom: 8px; display: inline-block; }
        .form-control { display: block; width: 100%; padding: 6px 12px; font-size: 16px; font-weight: 400; line-height: 1.5; color: #212529; background-color: #fff; border: 1px solid #ced4da; border-radius: 6px; margin-bottom: 16px; }
        .btn { display: inline-block; font-weight: 700; line-height: 1.5; color: #212529; text-align: center; text-decoration: none; vertical-align: middle; cursor: pointer; padding: 8px 16px; font-size: 16px; border-radius: 6px; border: 1px solid transparent; }
        .btn-primary { color: #fff; background-color: #0d6efd; border-color: #0d6efd; }
        .btn-primary:hover { background-color: #0b5ed7; border-color: #0a58ca; }
        .btn-success { color: #fff; background-color: #198754; border-color: #198754; }
        .btn-danger { color: #fff; background-color: #dc3545; border-color: #dc3545; }
        .w-100 { width: 100%!important; }
        .d-none { display: none!important; }
        .d-flex { display: flex!important; }
        .justify-content-between { justify-content: space-between!important; }
        .align-items-center { align-items: center!important; }
        .flex-wrap { flex-wrap: wrap!important; }
        .gap-2 { gap: 8px!important; }
        .m-0 { margin: 0!important; }
        .mt-4 { margin-top: 16px!important; }
        .p-3 { padding: 16px!important; }
        .badge { display: inline-block; padding: 6px 10px; font-size: 12px; font-weight: 700; line-height: 1; border-radius: 12px; margin-bottom: 8px; }
        .badge-bekliyor { background-color: #6c757d; color: white; }
        .badge-uretimde { background-color: #0dcaf0; color: #000; }
        .badge-bitti { background-color: #198754; color: white; }
        .info-block { background: #f8f9fa; padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 5px; color: #212529; }
        .sticky-top-panel { position: sticky; top: 0; background: rgba(244, 246, 249, 0.95); z-index: 1000; padding: 15px 0; border-bottom: 1px solid #e2e8f0; }
        .form-select { display: block; width: 100%; padding: 4px 8px; font-size: 14px; color: #212529; background-color: #fff; border: 1px solid #ced4da; border-radius: 4px; }
        .spinner { border: 4px solid rgba(0, 0, 0, 0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: #0d6efd; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="container">
    <div class="text-center mb-4" id="headerSection">
        <h2 class="fw-bold text-primary">Yan Sanayi İş Takip Portalı</h2>
        <p class="text-muted">Güncel fason siparişlerinizi görüntüleyin ve durum bildirimi yapın.</p>
    </div>

    <!-- Giriş Ekranı -->
    <div id="loginSection" class="row justify-content-center">
        <div style="width: 100%; max-width: 450px;">
            <div class="card" style="border-left: none;">
                <label class="form-label fw-bold">Tedarikçi Adınızı Girin:</label>
                <input type="text" id="firmaAdi" class="form-control" placeholder="Örn: EMO veya EMO MAKINA">
                <button onclick="isleriListele()" id="btnListele" class="btn btn-primary w-100">İşlerimi Listele</button>
            </div>
        </div>
    </div>

    <!-- İş Listesi Üst Sabit Panel -->
    <div id="listSection" class="d-none">
        <div class="sticky-top-panel">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div>
                    <h4 id="welcomeText" class="fw-bold m-0" style="color: #212529;"></h4>
                    <small class="text-muted" id="totalCount"></small>
                </div>
                <div class="d-flex gap-2">
                    <button onclick="topluKaydet()" id="btnTopluKaydet" class="btn btn-success fw-bold">⚡ Tüm Listeyi Toplu Kaydet</button>
                    <button onclick="location.reload()" class="btn btn-danger fw-bold">Çıkış Yap</button>
                </div>
            </div>
        </div>
        <div id="isKartlari" class="mt-4"></div>
    </div>
</div>

<script>
    // Canlı test ettiğimiz %100 çalışan Google Apps Script linkiniz
    const API_URL = "https://google.com"; 

    let aktifFirma = "";
    let mevcutIsler = [];

    function formatVeri(deger) {
        if (deger === undefined || deger === null) return "-";
        try {
            let str = String(deger).trim();
            if (str.includes("T") && str.includes("Z")) {
                return str.split("T")[0]; 
            }
            return str;
        } catch(e) {
            return "-";
        }
    }

    function isleriListele() {
        aktifFirma = document.getElementById("firmaAdi").value.trim();
        if(!aktifFirma) return alert("Lütfen tedarikçi adınızı girin.");
        
        document.getElementById("loginSection").classList.add("d-none");
        document.getElementById("listSection").classList.remove("d-none");
        document.getElementById("headerSection").classList.add("d-none");
        document.getElementById("isKartlari").innerHTML = `<div class="text-center mb-4"><div class="spinner"></div><p>Güvenli bağlantı kuruluyor, işleriniz çekiliyor...</p></div>`;

        // JSONP Köprüsü: Güvenlik kilidini aşar
        const script = document.createElement('script');
        script.src = `${API_URL}?action=read&firma=${encodeURIComponent(aktifFirma)}&callback=veriGeriDonusIsle`;
        document.body.appendChild(script); 
    }

    function veriGeriDonusIsle(data) {
        mevcutIsler = data;
        let html = "";
        document.getElementById("totalCount").innerText = `Toplam Kalem Sayısı: ${data.length}`;
        
        if(!data || data.length === 0) {
            html = `<div style="background-color: #fff3cd; color: #664d03; padding: 16px; border-radius: 6px; text-align: center; font-weight: bold;">Eşleşen aktif fason iş emri bulunamadı.</div>`;
            document.getElementById("btnTopluKaydet").classList.add("d-none");
        } else {
            document.getElementById("btnTopluKaydet").classList.remove("d-none");
            data.forEach((is, index) => {
                try {
                    let rowId = is.id ? formatVeri(is.id) : index.toString();
                    let uretimDurumu = is.firmadurumu ? formatVeri(is.firmadurumu) : "Bekliyor";
                    if (uretimDurumu.includes("-") || uretimDurumu === "" || uretimDurumu === "undefined") uretimDurumu = "Bekliyor";
                    
                    let badgeClass = uretimDurumu === 'Bitti' ? 'badge-bitti' : (uretimDurumu === 'Üretimde' ? 'badge-uretimde' : 'badge-bekliyor');
                    
                    let miktar = is.uretilendir_miktar ? parseInt(formatVeri(is.uretilendir_miktar)) : 0;
                    if(isNaN(miktar)) miktar = 0;

                    html += `
                    <div class="card p-3" data-id="${rowId}">
                        <div class="d-flex justify-content-between align-items-center flex-wrap">
                            <div class="mb-2">
                                <span class="badge ${badgeClass}" id="badge_${rowId}">${uretimDurumu}</span>
                                <h5 class="fw-bold m-0" style="color: #2c3e50; font-size: 18px; margin-bottom: 4px;">${formatVeri(is.strno)}</h5>
                                <small class="text-muted">Sipariş No: <b>${formatVeri(is.tanim)}</b> | Parça No: <b>${formatVeri(is.sprsno)}</b></small>
                            </div>
                            <div style="text-align: right;">
                                <span class="text-muted" style="display: block; font-size: 12px; font-weight: bold;">Kalan Bakiye</span>
                                <span class="fw-bold text-primary" style="font-size: 24px;">${formatVeri(is.ob)}</span>
                            </div>
                        </div>
                        
                        <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; margin-bottom: 12px;">
                            <div style="flex: 1; min-width: 150px;"><div class="info-block"><b>Sipariş Tipi:</b> ${formatVeri(is.sptp)}</div></div>
                            <div style="flex: 1; min-width: 150px;"><div class="info-block"><b>Para Birimi:</b> ${formatVeri(is.sprstarihi)}</div></div>
                            <div style="flex: 1; min-width: 150px;"><div class="info-block"><b>Detay / Teslim:</b> <span style="color: #dc3545; font-weight: bold;">${formatVeri(is.teslimtarihi)}</span></div></div>
                        </div>

                        <hr style="border: 0; border-top: 1px solid #eee; margin: 12px 0;">
